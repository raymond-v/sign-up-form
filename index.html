<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="images/background-image.jpg" class="background">
    <div class="logo-background">
        <img src="images/odin-logo.png" class="logo">
        <span class="title">Odin</span>
    </div>
    <div class="right-side">
        <div class="top">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started</p>
            <p>You <em>know</em> you want to.</p>
        </div>
        <div class="middle">
            <p>Let's do this!</p>
            <form id="signup">
            <div>
                <label for="first">First Name</label>
                <input id="first" type="text" name="first">
            </div>
            <div>
                <label for="last">Last Name</label>
                <input id="last" type="text" name="last">        
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" type="email" name="email">
            </div>
            <div>
                <label for="phone">Phone Number</label>
                <input id="phone" type="tel" name="phone">
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" type="password" name="password" minlength="8" required>
            </div>
            <div>
                <label for="cpassword">Confirm Password</label>
                <input id="cpassword" type="password" name="cpassword" minlength="8" required>
            </div>
            </form>
        </div>
        <div class="bottom">
            <button type="submit" form="signup">Create Account</button>
            <p class="login">Already have an account? <a>Log in</a></p>
        </div>
    </div>
</body>
</html>
